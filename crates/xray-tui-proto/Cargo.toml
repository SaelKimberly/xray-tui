[package]
name = "xray-tui-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true



[features]
default = []
experimental = []

[dependencies]
# ============ Serialization ============
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { version = "^3.21.0", default-features = false, features = ["macros"] }

# ============ URL & Encoding ============
url = { workspace = true }
urlencoding.workspace = true
base64 = { version = "^0.23.1" }

# ============ Error Handling ============
thiserror = { workspace = true }

# ============ Text / Search / Hash ============
rapidhash.workspace = true
uuid = { workspace = true, features = ["v5"] }

# ============ TLS ============
rustls = { workspace = true, features = ["std", "tls12"] }

# ============ Parsing ============
nom = { version = "^8.0.0", default-features = false, features = ["std"] }

# ============ ORM (Embed derives only) ============
toasty.workspace = true

# ============ Performance & Memory ============
smallvec.workspace = true
bstr = { version = "^1.12.1", default-features = false, features = ["std"] }
aho-corasick.workspace = true
# Small inline string for URL/credential text. `compact_str` replaces the
# unmaintained `smartstring` (RUSTSEC-2026-0249) and is already in the graph
# via ratatui-core, so this pins the version already resolved (0.9.x) instead
# of adding a second major.
compact_str = { version = "^0.9.1", features = ["serde"] }

# ============ IDNA for hostname parsing ============
idna = { version = "^1.1.0", default-features = false, features = ["std", "compiled_data"] }

# ============ Logging ============
tracing = { workspace = true }
xray-tui-hakari = { version = "0.1", path = "../xray-tui-hakari" }

[lints]
workspace = true

# Identity benches: per-kind `ParsedProto::identity_once()` cost. Hermetic —
# no cores, no sockets, no features; `cargo criterion -p xray-tui-proto
# --bench identity`.
[[bench]]
name = "identity"
harness = false

[dev-dependencies]
criterion = { workspace = true }
