[package]
name = "xray-tui-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true



[features]
default = []
experimental = []

[dependencies]
# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { version = "^3.21.0", default-features = false, features = ["macros"] }

# URL & Encoding
url = { workspace = true }
urlencoding = { version = "^2.1.3" }
base64 = { version = "^0.22.1" }
escape8259 = { version = "^0.5.3" }
# Error Handling
thiserror = { workspace = true }

# Text / Search / Hash
rapidhash = { version = "^4.4.1", default-features = false, features = ["std", "unsafe"] }
uuid = { workspace = true, features = ["v5"] }
itoa = { version = "^1.0" }
memchr = { version = "*" }

# Networking types
rustls = { version = "*", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = { version = "1.15.0"  }

# Parsing
nom = { version = "^8.0.0", default-features = false, features = ["std"] }

# Performance & Memory
smallvec = { version = "*", default-features = false, features = ["const_new"] }
bstr = { version = "^1.12.1", default-features = false, features = ["std"] }
aho-corasick = { version = "^1.1.4" }
smartstring = { version = "^1.0.1", features = ["serde"] }

# IDNA for hostname parsing
idna = { version = "^1.1.0", default-features = false, features = ["std", "compiled_data"] }

# Character encoding detection
chardetng = { version = "^1.0.0", features = ["multithreading"] }

# Logging
tracing = { workspace = true }

[lints]
workspace = true
