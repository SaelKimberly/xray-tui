[package]
name = "xray-tui-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true



[features]
default = []
experimental = []

[dependencies]
# ============ Serialization ============
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { version = "^3.21.0", default-features = false, features = ["macros"] }

# ============ URL & Encoding ============
url = { workspace = true }
urlencoding.workspace = true
base64 = { version = "^0.22.1" }

# ============ Error Handling ============
thiserror = { workspace = true }

# ============ Text / Search / Hash ============
rapidhash.workspace = true
uuid = { workspace = true, features = ["v5"] }

# ============ TLS ============
rustls = { workspace = true, features = ["std", "tls12"] }

# ============ Parsing ============
nom = { version = "^8.0.0", default-features = false, features = ["std"] }

# ============ ORM (Embed derives only) ============
toasty = { version = "0.9", default-features = false }

# ============ Performance & Memory ============
smallvec.workspace = true
bstr = { version = "^1.12.1", default-features = false, features = ["std"] }
aho-corasick.workspace = true
smartstring = { version = "^1.0.1", features = ["serde"] }

# ============ IDNA for hostname parsing ============
idna = { version = "^1.1.0", default-features = false, features = ["std", "compiled_data"] }

# ============ Logging ============
tracing = { workspace = true }
xray-tui-hakari = { version = "0.1", path = "../xray-tui-hakari" }

[lints]
workspace = true
