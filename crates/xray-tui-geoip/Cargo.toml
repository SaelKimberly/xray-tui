[package]
name = "xray-tui-geoip"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# ============ Geo ============
maxminddb = { version = "0.30", features = ["simdutf8"] }

# ============ Async Runtime & I/O ============
tokio = { workspace = true, features = ["sync", "fs", "io-util", "rt"] }

# ============ Networking ============
reqwest.workspace = true
# ring provider install before reqwest Client::build (rustls-no-provider)
rustls = { workspace = true, features = ["ring"] }

# ============ Error Handling ============
anyhow.workspace = true

# ============ Logging ============
tracing.workspace = true
xray-tui-hakari = { version = "0.1", path = "../xray-tui-hakari" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
