[package]
name = "xray-tui-db"
version.workspace = true
edition.workspace = true

[dependencies]
# ============ ORM ============
toasty = { version = "0.9", features = ["turso", "serde"] }
toasty-driver-turso = "0.9"
toasty-core = "0.9"

# ============ Serialization ============
serde.workspace = true

# ============ Error Handling ============
thiserror.workspace = true

# ============ Logging ============
tracing.workspace = true

# ============ Text / Search / Hash ============
uuid.workspace = true
rapidhash.workspace = true

# ============ Async Runtime & I/O ============
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
toasty = { version = "0.9", features = ["turso", "serde"] }
serde_json = "1"
tempfile = "3"