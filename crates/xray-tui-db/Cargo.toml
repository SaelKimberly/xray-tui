[package]
name = "xray-tui-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# ============ ORM ============
toasty = { version = "0.9", features = ["turso", "serde", "jiff"] }
toasty-driver-turso = "0.9"
toasty-core = "0.9"

# ============ Time ============
jiff = { workspace = true }

# ============ Typed proto configs ============
xray-tui-proto = { path = "../xray-tui-proto", version = "0.1.0" }

# ============ Error Handling ============
	thiserror.workspace = true

# ============ Logging ============
tracing.workspace = true

# ============ Text / Search / Hash ============
uuid.workspace = true

# ============ Async Runtime & I/O ============
tokio.workspace = true
xray-tui-hakari = { version = "0.1", path = "../xray-tui-hakari" }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
toasty = { version = "0.9", features = ["turso", "serde", "jiff"] }
jiff = { workspace = true }
xray-tui-proto = { path = "../xray-tui-proto", version = "0.1.0" }
tempfile = "3"
