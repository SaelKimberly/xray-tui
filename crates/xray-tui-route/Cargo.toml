[package]
name = "xray-tui-route"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

# ============ Error Handling ============
thiserror.workspace = true

# ============ Text / Search / Hash ============
aho-corasick.workspace = true
regex = "1.11"
parking_lot = "0.12"
tokio = { workspace = true, features = ["sync"] }

# ============ Sniffing (QUIC Initial packet decryption) ============
aes.workspace = true
ring.workspace = true

# ============ Time / Duration Parsing ============
jiff.workspace = true

[features]
default = []
dns = ["dep:xray-tui-dns"]
geoip = ["dep:xray-tui-geoip"]

[dependencies.xray-tui-dns]
version = "0.1"
path = "../xray-tui-dns"
optional = true

[dependencies.xray-tui-geoip]
version = "0.1"
path = "../xray-tui-geoip"
optional = true

# [[bench]] target: `harness = false` — criterion owns `main`. No
# `required-features`: `Engine::decide` is pure and the bench needs nothing
# beyond the crate's default features.
[[bench]]
name = "decide"
harness = false

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
xray-tui-tls = { version = "0.1", path = "../xray-tui-tls" }
# Routing decision benches (`benches/decide.rs`): criterion harness only —
# the engine's decide path is synchronous, so no async feature is needed.
criterion = { workspace = true }

[package.metadata.cargo-machete]
# `xray-tui-geoip` is wired by the `geoip` feature only, and geo matching is
# not implemented yet — the IR already carries `geo_country` fields, but no
# matcher consults the crate, so machete cannot see the dependency.
ignored = ["xray-tui-geoip"]

[lints]
workspace = true
