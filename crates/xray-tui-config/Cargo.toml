[package]
name = "xray-tui-config"
version.workspace = true
edition.workspace = true

[dependencies]
# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

# ============ Error Handling ============
thiserror.workspace = true

# ============ Config & Filesystem ============
dirs.workspace = true

# ============ Encoding ============
base64-simd = "0.8"
escape8259 = "0.5"
urlencoding = "2"
simdutf8 = "0.1"
url = "2"

# ============ Text / Search / Hash ============
uuid.workspace = true
aho-corasick = "1"
memchr = "^1"   # pinned to v1; v2 exists but API differs

# ============ Memory ============
smallvec = { version = "1", features = ["const_new"] }
once_cell = "1"

# ============ Internal ============
xray-tui-core = { path = "../xray-tui-core" }
xray-tui-db = { path = "../xray-tui-db" }

# ============ Logging ============
tracing.workspace = true

[lints]
workspace = true
