[package]
name = "xray-tui-config"
version.workspace = true
edition.workspace = true

[dependencies]
# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

# ============ Error Handling ============
thiserror.workspace = true

# ============ Config & Filesystem ============
dirs.workspace = true

# ============ Time / Duration Parsing ============
humantime.workspace = true
# ============ Encoding ============
base64-simd = "0.8"
escape8259 = "0.5"
urlencoding = "2.1"
simdutf8 = "0.1"
url = "2.5"

# ============ Text / Search / Hash ============
uuid.workspace = true
aho-corasick = "1.1"
memchr = "2"
ratatui-themes = "0.2"

# ============ Memory ============
smallvec = { version = "1", features = ["const_new"] }

# ============ Internal ============
xray-tui-core = { path = "../xray-tui-core" }
xray-tui-proto = { path = "../xray-tui-proto" }
xray-tui-db = { path = "../xray-tui-db" }

# ============ Logging ============
tracing.workspace = true

[lints]
workspace = true
