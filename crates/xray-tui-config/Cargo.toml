[package]
name = "xray-tui-config"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64-simd = "0.8"
escape8259 = "0.5"
memchr = "1"
simdutf8 = "0.1"
urlencoding = "2"
thiserror = "2"
dirs = "6"
aho-corasick = "1"
url = "2"
xray-tui-core = { path = "../xray-tui-core" }
xray-tui-db = { path = "../xray-tui-db" }
uuid = { version = "1", features = ["v4"] }
smallvec = { version = "1", features = ["const_new"] }
once_cell = "1"
