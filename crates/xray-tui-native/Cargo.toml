[package]
name = "xray-tui-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# source of truth for all protocol/transport/security configs (MIT, workspace)
xray-tui-proto.workspace = true

# async runtime
tokio = { workspace = true, features = ["net", "io-util", "time"] }

# TLS (workspace standard: ring backend)
rustls = { workspace = true, features = ["ring"] }
tokio-rustls = "0.26"
webpki-roots = "1"

# VMess wire crypto (mandatory for any VMess client — not feature-gated)
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
crc32fast = "1"
md-5 = "0.10"

# CSPRNG for per-connection VMess session material (same provider rustls uses)
ring = "0.17"

# errors
thiserror.workspace = true

# misc
uuid.workspace = true

# e2e pipeline (crate-side module -> real deps, optional behind the feature)
serde_json = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
rcgen = { version = "0.13", optional = true }
tiny_http = { version = "0.12", optional = true }

[lints]
workspace = true

[features]
native-e2e = ["dep:serde_json", "dep:tempfile", "dep:rcgen", "dep:tiny_http"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# serde_json/rcgen are used by unit tests in security/transport/context/chain,
# which compile without the `native-e2e` feature — dev-deps make them available
# to lib unit tests regardless of feature selection (normal optional deps stay
# for the feature-gated e2e module).
serde_json.workspace = true
rcgen = "0.13"
