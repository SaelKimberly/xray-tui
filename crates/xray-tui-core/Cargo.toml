[package]
name = "xray-tui-core"
version.workspace = true
edition.workspace = true

[dependencies]
# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

# ============ Error Handling ============
thiserror.workspace = true

# ============ Networking ============
reqwest.workspace = true
reqwest.features = ["socks", "stream", "json"]

# ============ Config & Filesystem ============
dirs.workspace = true

# ============ Async Runtime & I/O ============
tokio.workspace = true
tokio.features = ["process", "signal", "sync", "fs", "time", "io-util", "rt", "rt-multi-thread"]
futures-util.workspace = true

# ============ Protocol ============
tonic = "0.14"
prost = "0.14"
semver = { version = "1.0", features = ["std"] }
async-trait = "0.1"
tonic-prost = "0.14"

# ============ Build & Archiving ============
zip = "8.6"
flate2 = "1.1"
tar = "0.4"

# ============ Internal ============
xray-tui-db = { path = "../xray-tui-db" }

# ============ Logging ============
tracing.workspace = true

[build-dependencies]
tonic-prost-build = "0.14"

[lints]
workspace = true
