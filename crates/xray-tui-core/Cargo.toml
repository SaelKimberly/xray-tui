[package]
name = "xray-tui-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xray-tui-db = { path = "../xray-tui-db" }
tokio = { version = "1", features = ["process", "signal", "sync", "fs", "time", "io-util", "rt"] }
zip = "2"
flate2 = "1"
tar = "0.4"
dirs = "6"
tonic = "0.12"
prost = "0.13"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream", "json"] }
semver = { version = "1", features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
[build-dependencies]
tonic-build = "0.12"
