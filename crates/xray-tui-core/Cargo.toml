[package]
name = "xray-tui-core"
version.workspace = true
edition.workspace = true
license.workspace = true


[features]
default = ["quic-ping"]
quic-ping = ["dep:quinn", "dep:rustls"]
[dependencies]
# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

yaml-rust2.workspace = true
# ============ Error Handling ============
thiserror.workspace = true

# ============ Networking ============
reqwest.workspace = true
reqwest.features = ["socks", "stream", "json"]

# ============ Async Runtime & I/O ============
	tokio.workspace = true
tokio.features = ["process", "signal", "sync", "fs", "time", "io-util", "rt", "rt-multi-thread", "net"]
futures-util.workspace = true

# ============ Protocol ============
tonic = "0.14"
semver = { version = "1.0", features = ["std"] }
async-trait = "0.1"
prost = "0.14"
quinn = { version = "0.11", optional = true }
# Transitive feature override (user-directed): tokio-rustls 0.26 defaults to
# the aws_lc_rs backend (`default = ["logging", "tls12", "aws_lc_rs"]`).
# Disable defaults and pin ring explicitly so rustls keeps exactly one
# backend in the whole graph — `ClientConfig::builder()` auto-selects it and
# never hits the dual-backend "Could not automatically determine the
# process-level CryptoProvider" panic. All other edges (reqwest
# rustls-no-provider, quinn, hyper-rustls) already opt out of tokio-rustls
# defaults.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { workspace = true, optional = true, features = ["tls12", "logging", "ring"] }
tonic-prost = "0.14"

# ============ Build & Archiving ============
zip = "8.6"
flate2 = "1.1"
tar = "0.4"

# ============ Internal ============
xray-tui-db = { path = "../xray-tui-db", version = "0.1.0" }
xray-tui-proto = { path = "../xray-tui-proto", version = "0.1.0" }

# ============ Logging ============
tracing.workspace = true
libc = "0.2"
tempfile = "3"

# ============ Persistent Log Storage ============
heed = { version = "0.22" }
postcard = { version = "1", features = ["alloc"] }
xray-tui-hakari = { version = "0.1", path = "../xray-tui-hakari" }

	[build-dependencies]
	tonic-prost-build = "0.14"

	[dev-dependencies]
	toasty = { workspace = true, features = ["serde"] }
	jiff.workspace = true

	[package.metadata.cargo-machete]
	# Deps used only by build.rs / OUT_DIR-generated code (invisible to
	# cargo-machete) or documented feature overrides:
	# - prost, tonic-prost, tonic-prost-build: tonic codegen output in OUT_DIR
	# - tokio-rustls: deliberate transitive backend override (ring pin), see the
	#   comment in [dependencies]
	ignored = ["prost", "tonic-prost", "tonic-prost-build", "tokio-rustls"]
