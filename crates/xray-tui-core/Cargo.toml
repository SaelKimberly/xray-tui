[package]
name = "xray-tui-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xray-tui-db = { path = "../xray-tui-db" }
tokio = { version = "1", features = ["process", "signal", "sync", "fs", "time", "io-util", "rt"] }
zip = "2"
flate2 = "1"
tar = "0.4"
dirs = "6"
