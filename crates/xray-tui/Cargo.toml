[package]
name = "xray-tui"
version.workspace = true
edition.workspace = true

[dependencies]
xray-tui-core = { path = "../xray-tui-core" }
xray-tui-db = { path = "../xray-tui-db" }
xray-tui-config = { path = "../xray-tui-config" }
xray-tui-proto = { path = "../xray-tui-proto" }
xray-tui-geoip = { path = "../xray-tui-geoip" }
xray-tui-dns = { path = "../xray-tui-dns" }
xray-tui-host-features = { path = "../xray-tui-host-features" }
toasty = "0.9"
jiff.workspace = true

# ============ Async Runtime & I/O ============
tokio.workspace = true
tokio.features = ["rt-multi-thread", "macros", "signal", "sync"]
futures-util.workspace = true
dashmap = "6"

# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

# ============ Networking ============
reqwest.workspace = true
reqwest.features = ["gzip"]
# rustls ring: process-level CryptoProvider::install_default() at startup
# (main.rs install_tls_provider) — reqwest 0.13 rustls-no-provider requires it.
rustls = { workspace = true, features = ["ring"] }

# ============ Config & Filesystem ============
dirs.workspace = true

# ============ TUI Framework ============
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
ratatui-themes.workspace = true
ratatui-cheese = "0.7"
tui-popup = "0.7"
tui-scrollbar = "0.2"
arboard = "3.6"

# ============ CLI ============
clap = { version = "4.6", features = ["derive"] }

# ============ Error Handling ============
anyhow = "1.0"

# ============ Text / Search / Hash ============
uuid.workspace = true

# ============ Logging ============
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "json"] }
chrono = { version = "0.4" }
humantime.workspace = true
regex = "1"
url.workspace = true
parking_lot = "0.12"

[lints]
workspace = true
[dev-dependencies]
tempfile = "3"
