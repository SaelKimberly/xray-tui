[package]
name = "xray-tui"
version.workspace = true
edition.workspace = true

[dependencies]
xray-tui-core = { path = "../xray-tui-core" }
xray-tui-db = { path = "../xray-tui-db" }
xray-tui-config = { path = "../xray-tui-config" }

# ============ Async Runtime & I/O ============
tokio.workspace = true
tokio.features = ["rt-multi-thread", "macros", "signal", "sync"]
futures-util.workspace = true

# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

# ============ Networking ============
reqwest.workspace = true
reqwest.features = ["gzip"]

# ============ Config & Filesystem ============
dirs.workspace = true

# ============ TUI Framework ============
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
arboard = "3.6"

# ============ CLI ============
clap = { version = "4.6", features = ["derive"] }

# ============ Error Handling ============
anyhow = "1.0"

# ============ Text / Search / Hash ============
uuid.workspace = true

# ============ Logging ============
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "json"] }

[lints]
workspace = true
