[package]
name = "xray-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xray-tui-core = { path = "../xray-tui-core", version = "0.1.0" }
xray-tui-db = { path = "../xray-tui-db", version = "0.1.0" }
xray-tui-config = { path = "../xray-tui-config", version = "0.1.0" }
xray-tui-proto = { path = "../xray-tui-proto", version = "0.1.0" }
xray-tui-route = { path = "../xray-tui-route", version = "0.1" }
xray-tui-geoip = { path = "../xray-tui-geoip", version = "0.1.0" }
xray-tui-dns = { path = "../xray-tui-dns", version = "0.1.0" }
xray-tui-host-features = { path = "../xray-tui-host-features", version = "0.1.0" }
xray-tui-native = { path = "../xray-tui-native", version = "0.1.0" }
toasty = { workspace = true, features = ["serde"] }
jiff.workspace = true

# ============ Async Runtime & I/O ============
tokio.workspace = true
tokio.features = ["fs", "io-util", "rt-multi-thread", "macros", "signal", "sync"]
futures-util.workspace = true
dashmap = "6.2.1"

# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

# ============ Networking ============
reqwest.workspace = true
reqwest.features = ["gzip"]
bytes.workspace = true
# rustls ring: process-level CryptoProvider::install_default() at startup
# (main.rs install_tls_provider) — reqwest 0.13 rustls-no-provider requires it.
rustls = { workspace = true, features = ["ring"] }

# ============ Config & Filesystem ============
dirs.workspace = true

# ============ TUI Framework ============
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2.2"
ratatui-themes.workspace = true
ratatui-cheese = "0.7.0"
tui-popup = "0.7.7"
tui-scrollbar = "0.2.8"
arboard = "3.6.1"

# ============ Error Handling ============
	anyhow.workspace = true

# ============ Text / Search / Hash ============
uuid.workspace = true

# ============ Logging ============
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry", "json"] }
chrono = { version = "0.4.45" }
humantime.workspace = true
url.workspace = true
parking_lot.workspace = true
# Memory-diet Task 6 (B-slice gate): the ONLY new-dep allowance. `lru 0.18`
# is already in Cargo.lock (toasty's transitive dep), so no new crates enter
# the tree — direct edges only for the TUI's bounded caches.
lru.workspace = true
xray-tui-hakari = { version = "0.1", path = "../xray-tui-hakari" }

[lints]
workspace = true
[dev-dependencies]
tempfile.workspace = true
base64-simd.workspace = true
