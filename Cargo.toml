[workspace]
resolver = "3"

members = ["crates/*"]

[workspace.package]
version = "0.1.0"

edition = "2024"
rust-version = "1.96.0"

readme = "README.md"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -2 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
